default_job = "clippy"
env.CARGO_TERM_COLOR = "always"

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets"]
need_stdout = false

[jobs.run]
command = [
    "cargo", "run",
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

[keybindings]
c = "job:clippy"
r = "job:run" 
