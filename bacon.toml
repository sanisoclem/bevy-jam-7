default_job = "clippy"
env.CARGO_TERM_COLOR = "always"

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--features=dev"]
need_stdout = false


[jobs.test]
command = ["cargo", "test", "--all"]
need_stdout = true

[jobs.run]
command = [
    "cargo", "run", "--features=dev"
]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

[keybindings]
c = "job:clippy"
r = "job:run" 
t = "job:test"
